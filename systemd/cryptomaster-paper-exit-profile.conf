[Service]
# PAPER-only responsive exit geometry.
# Production baseline (2026-07-31, last 200 closes):
# TIMEOUT 78%, median MFE 11.7 bps, median MAE 10.7 bps.
# These bands keep TP above the observed ~4 bps simulation cost while making
# TP/SL reachable inside the bounded five-minute learning horizon.
Environment="PAPER_TP_ZONE_BPS=15"
Environment="PAPER_SL_ZONE_BPS=12"
Environment="PAPER_MIN_TP_BPS=8"
