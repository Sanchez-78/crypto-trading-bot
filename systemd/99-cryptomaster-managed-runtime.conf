[Service]
# Authoritative PAPER-only runtime overlay. Production must install only this
# file in cryptomaster.service.d; older overlays are rollback material, not
# active configuration.
#
# 2026-08-10: brought under version control for the first time. Previously
# this file existed ONLY as an untracked file on the server
# (/etc/systemd/system/cryptomaster.service.d/99-cryptomaster-managed-runtime.conf),
# which is how PAPER_TP_ZONE_BPS=12 / PAPER_SL_ZONE_BPS=10 reached production
# on 2026-07-31 with no PR, no review, and no record anywhere in git history
# (see _workspace/17_wr_stuck_live_tp_sl_still_violates_cost_floor.md and
# docs/P0_7_P1_3_REPOSITORY_ARCHITECTURE.md's Gate G0 gap table, which had
# already flagged this exact governance gap). That geometry required a 63.6%
# TP-hit-share to break even against the deployed 4bps round-trip cost
# (PAPER_FEE_PCT=0.0004, PAPER_SLIPPAGE_PCT=0.0) while the realized share sat
# at 12-50% depending on window -- a structural, guaranteed-losing config
# that two subsequent "fixes" (commits f6e2f28, 09f1acd) never touched
# because both only changed the CODE default, which os.getenv() never
# consults once this file sets the env var explicitly.
#
# Going forward: this tracked file is the source of truth. Server-side
# changes must update THIS file and redeploy it (diffable, reviewable),
# not edit the server copy directly -- doing so silently is exactly how the
# violating geometry above got deployed in the first place.
ExecStart=
ExecStart=/usr/bin/python3 -u /opt/cryptomaster/start.py

# Execution safety
Environment="TRADING_MODE=paper_train"
Environment="ENABLE_REAL_ORDERS=false"
Environment="REAL_ORDERS_ALLOWED=false"
Environment="REAL_TRADING_ENABLED=false"
Environment="LIVE_TRADING_CONFIRMED=false"
Environment="PAPER_ONLY_MODE=true"

# Paper throughput and exposure
Environment="MAX_TRADES_PER_HOUR=300"
Environment="PAPER_MAX_POSITIONS=50"
Environment="LEARNING_FORCE_ENABLED=true"
Environment="PAPER_EXPLORATION_ENABLED=false"
Environment="TRADING_AGENT_EXPLORATION_ENABLED=true"
Environment="TRADING_AGENT_EXPLORATION_MAX_PER_HOUR=60"
Environment="TRADING_AGENT_EXPLORATION_SIZE_USD=25.00"
Environment="TRADING_AGENT_EXPLORATION_DROUGHT_S=120"
Environment="TRADING_AGENT_POSITIVE_SEGMENT_MIN_N=20"
Environment="TRADING_AGENT_POSITIVE_SEGMENT_MIN_PF=1.25"
Environment="TRADING_AGENT_LEARNING_HISTORY_RESET=true"
Environment="PAPER_SIDE_BALANCE_ENFORCEMENT=false"

# Bounded Firebase hydration and process-level read circuit breaker
Environment="FIREBASE_LEARNING_ARCHIVE_HYDRATE_LIMIT=300"
Environment="TRADING_AGENT_ARCHIVE_HYDRATE_LIMIT=300"
Environment="TRADING_AGENT_HOURLY_ARCHIVE_HYDRATE_LIMIT=300"
Environment="FIREBASE_QUOTA_MAX_READS_PER_HOUR=600"

# Paper exit and strategy geometry
Environment="PAPER_EXIT_REPAIR_ENABLED=true"
Environment="PAPER_SCRATCH_FEE_COVER_BPS=20"
Environment="PAPER_STAGNATION_SIZE_DOWN_ENABLED=true"
Environment="PAPER_DEVIATION_FADE=false"
Environment="PAPER_DEV_GATE_BPS=25"
Environment="PAPER_DEV_LOOKBACK_S=900"
Environment="PAPER_SYMBOL_BLACKLIST=BNBUSDT,XRPUSDT,BTCUSDT,DOTUSDT"
Environment="PAPER_MAX_POSITION_AGE_S=900"
Environment="PAPER_FEE_PCT=0.0004"
Environment="PAPER_SLIPPAGE_PCT=0.0"
Environment="PAPER_TRAIN_STRICT_TAKE_ENABLED=true"
Environment="PAPER_P0_DIRECT_SIGNAL_ROUTER_ENABLED=false"
Environment="PAPER_DIRECT_CANONICAL_MIN_EV=0.02"
Environment="PAPER_CANONICAL_FAST_PATH=true"
Environment="PAPER_CANONICAL_REQUIRE_REGIME_ALIGNMENT=true"
Environment="PAPER_MIN_TP_BPS=8"
# PAPER_TP_ZONE_BPS / PAPER_SL_ZONE_BPS intentionally REMOVED (2026-08-10):
# were 12/10, violating validate_tp_sl_cost_floor() at the 4bps cost above
# (needed a 63.6% breakeven TP-hit-share; see comment block at top of file).
# Removing them lets src/services/paper_trade_executor.py's shipped default
# (_SHIPPED_TP_ZONE_BPS=50, _SHIPPED_SL_ZONE_BPS=25, commit 09f1acd) actually
# take effect in production for the first time -- 38.7% breakeven share at
# this same 4bps cost, reviewed and approved in _workspace/16_review.md.
# This does NOT establish that the current signal path is profitable (a
# 2026-08-07 grid search over TP/SL in [8,40]bps against the live MFE/MAE
# distribution found no profitable geometry in that range -- see
# _workspace/17_wr_stuck_live_tp_sl_still_violates_cost_floor.md); it removes
# an actively, mathematically guaranteed-losing configuration while the
# larger fix (wiring the cost-aware P0.8-P1.2 strategies into the live loop)
# is designed.

# Paper account model (virtual funds only)
Environment="ACCOUNT_BALANCE_USD=5000"
Environment="MAX_DAILY_LOSS_PCT=0.02"
Environment="KELLY_SAFETY_FACTOR=0.25"

# TEMPORARY diagnostic (2026-08-12): find the ~49k/50k unattributed Firestore
# read burn confirmed in _workspace/22_quota_burn_confirmed_dashboard_lies.md.
# Manual code review did not converge; this enables firebase_client.py's
# read-call-site tracer (adds one inspect.stack() per real Firestore read --
# acceptable for a bounded observation window, not meant to stay on
# permanently). Remove this line once the source is found and fixed.
Environment="FIREBASE_READ_TRACE_ENABLED=true"
