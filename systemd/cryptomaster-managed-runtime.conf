[Service]
# Authoritative PAPER-only runtime overlay. Production must install only this
# file in cryptomaster.service.d; older overlays are rollback material, not
# active configuration.
ExecStart=
ExecStart=/usr/bin/python3 -u /opt/cryptomaster/start.py

# Execution safety
Environment="TRADING_MODE=paper_train"
Environment="ENABLE_REAL_ORDERS=false"
Environment="REAL_ORDERS_ALLOWED=false"
Environment="REAL_TRADING_ENABLED=false"
Environment="LIVE_TRADING_CONFIRMED=false"
Environment="PAPER_ONLY_MODE=true"

# Paper throughput and exposure
Environment="MAX_TRADES_PER_HOUR=300"
Environment="PAPER_MAX_POSITIONS=50"
Environment="LEARNING_FORCE_ENABLED=true"
Environment="PAPER_EXPLORATION_ENABLED=false"
Environment="TRADING_AGENT_EXPLORATION_ENABLED=true"
Environment="TRADING_AGENT_EXPLORATION_MAX_PER_HOUR=60"
Environment="TRADING_AGENT_EXPLORATION_SIZE_USD=25.00"
Environment="TRADING_AGENT_EXPLORATION_DROUGHT_S=120"
Environment="TRADING_AGENT_LEARNING_HISTORY_RESET=true"
Environment="PAPER_SIDE_BALANCE_ENFORCEMENT=false"

# Bounded Firebase hydration and process-level read circuit breaker
Environment="FIREBASE_LEARNING_ARCHIVE_HYDRATE_LIMIT=300"
Environment="TRADING_AGENT_ARCHIVE_HYDRATE_LIMIT=300"
Environment="TRADING_AGENT_HOURLY_ARCHIVE_HYDRATE_LIMIT=300"
Environment="FIREBASE_QUOTA_MAX_READS_PER_HOUR=600"

# Paper exit and strategy geometry
Environment="PAPER_EXIT_REPAIR_ENABLED=true"
Environment="PAPER_SCRATCH_FEE_COVER_BPS=20"
Environment="PAPER_STAGNATION_SIZE_DOWN_ENABLED=true"
Environment="PAPER_DEVIATION_FADE=true"
Environment="PAPER_DEV_GATE_BPS=25"
Environment="PAPER_DEV_LOOKBACK_S=900"
Environment="PAPER_SYMBOL_BLACKLIST=BNBUSDT,XRPUSDT,BTCUSDT,DOTUSDT"
Environment="PAPER_MAX_POSITION_AGE_S=900"
Environment="PAPER_FEE_PCT=0.0004"
Environment="PAPER_SLIPPAGE_PCT=0.0"
Environment="PAPER_TRAIN_STRICT_TAKE_ENABLED=true"
Environment="PAPER_P0_DIRECT_SIGNAL_ROUTER_ENABLED=false"
Environment="PAPER_DIRECT_CANONICAL_MIN_EV=0.02"
Environment="PAPER_CANONICAL_FAST_PATH=true"
Environment="PAPER_CANONICAL_REQUIRE_REGIME_ALIGNMENT=true"
Environment="PAPER_MIN_TP_BPS=8"
Environment="PAPER_TP_ZONE_BPS=12"
Environment="PAPER_SL_ZONE_BPS=10"

# Paper account model (virtual funds only)
Environment="ACCOUNT_BALANCE_USD=5000"
Environment="MAX_DAILY_LOSS_PCT=0.02"
Environment="KELLY_SAFETY_FACTOR=0.25"
